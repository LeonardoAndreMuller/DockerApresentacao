<VirtualHost *:80>
    # O Laravel é servido a partir da pasta public/.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Libera o .htaccess do Laravel (reescreve as rotas para o index.php).
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
