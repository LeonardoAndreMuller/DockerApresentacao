; Ajustes de desenvolvimento.
; O OPcache vem ligado no Apache e só revalida os arquivos a cada 2s;
; com revalidate_freq=0 toda alteração no código aparece já na próxima requisição.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
