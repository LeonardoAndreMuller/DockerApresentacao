# ATENÇÃO — boas práticas
# Este arquivo foi feito para uma apresentação, por isso as credenciais e
# configurações (senhas do banco, usuário do pgAdmin, portas etc.) estão
# escritas diretamente aqui para facilitar a leitura.
#
# Em um projeto real isso NÃO deve ser feito: segredos não devem ir para o
# controle de versão. O correto é colocar os valores no arquivo .env (que fica
# fora do Git) e referenciá-los aqui com interpolação, por exemplo:
#
#   environment:
#     POSTGRES_PASSWORD: ${DB_PASSWORD}
#
# O Docker Compose lê automaticamente o .env da mesma pasta do compose.yaml.
# Também é possível usar "env_file: .env" no serviço ou, para dados sensíveis
# em produção, "secrets". Mantenha um .env.example versionado, sem os valores
# reais, documentando quais variáveis são necessárias.

name: pedidos

services:
  # Proxy reverso: única porta de entrada (80). Configuração em docker/traefik/;
  # as rotas de cada serviço vêm dos labels abaixo (lidos pelo docker.sock):
  #   /            -> app          /pgadmin   -> pgadmin
  #   /portainer/  -> portainer    /vite      -> vite (assets e hot reload)
  #   /dashboard/  -> painel do próprio Traefik
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Bind mount da pasta (não só do arquivo): o Traefik detecta na hora as
      # alterações em docker/traefik/dynamic/. O traefik.yaml é a configuração
      # estática e só é relido com "docker compose restart traefik".
      - ./docker/traefik:/etc/traefik:ro

  # Banco de dados PostgreSQL. Os dados ficam no volume nomeado "pgdata".
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicação Laravel servida pelo Apache (php:8.5-apache).
  # O código do host é montado em /var/www/html: editou, refletiu.
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: pedidos-app:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pedidos
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    # Sem "ports": o acesso é só pelo Traefik, em http://localhost/.
    volumes:
      - ./:/var/www/html
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.routers.app.middlewares=rate-limit@file
      - traefik.http.services.app.loadbalancer.server.port=80

  # Servidor de desenvolvimento do Vite (CSS/JS com hot reload no navegador).
  vite:
    image: node:24-slim
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      DOCKER: "true"
      HOME: /tmp
    command: sh -c "[ -d node_modules ] || npm install; npm run dev"
    # Acessado pelo Traefik em /vite (veja "base" no vite.config.js).
    volumes:
      - ./:/var/www/html
    labels:
      - traefik.enable=true
      - traefik.http.routers.vite.rule=PathPrefix(`/vite`)
      - traefik.http.routers.vite.entrypoints=web
      # Sem rate-limit: em dev o Vite serve dezenas de módulos por página.
      - traefik.http.routers.vite.middlewares=vite-fonts
      # O plugin do Laravel serve as fontes fora do "base" (/vite), então
      # reescrevemos /vite/__laravel_vite_plugin__/... para /__laravel_vite_plugin__/...
      - traefik.http.middlewares.vite-fonts.replacepathregex.regex=^/vite(/__laravel_vite_plugin__/.*)
      - traefik.http.middlewares.vite-fonts.replacepathregex.replacement=$$1
      - traefik.http.services.vite.loadbalancer.server.port=5173

  # Interface web do PostgreSQL, já com o servidor "Pedidos (Docker)" cadastrado.
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # Gera o pgpass (precisa de chmod 600) para conectar sem pedir senha.
    entrypoint: >
      /bin/sh -c "printf 'postgres:5432:*:laravel:secret\n' > /tmp/pgpass
      && chmod 600 /tmp/pgpass
      && exec /entrypoint.sh"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=PathPrefix(`/pgadmin`)
      - traefik.http.routers.pgadmin.entrypoints=web
      - traefik.http.routers.pgadmin.middlewares=pgadmin-path,rate-limit@file
      # Informa ao pgAdmin que ele está em /pgadmin, para gerar os links certos.
      - traefik.http.middlewares.pgadmin-path.headers.customRequestHeaders.X-Script-Name=/pgadmin
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  # Painel para gerenciar containers, imagens, volumes e redes.
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=PathPrefix(`/portainer`)
      - traefik.http.routers.portainer.entrypoints=web
      - traefik.http.routers.portainer.middlewares=portainer-slash,portainer-strip,rate-limit@file
      # /portainer -> /portainer/ (o front do Portainer usa caminhos relativos).
      # "$$" escapa o "$" para o Compose não tratar como variável.
      - traefik.http.middlewares.portainer-slash.redirectregex.regex=^(https?://[^/]+/portainer)$$
      - traefik.http.middlewares.portainer-slash.redirectregex.replacement=$${1}/
      # Remove o /portainer antes de repassar: o Portainer espera estar na raiz.
      - traefik.http.middlewares.portainer-strip.stripprefix.prefixes=/portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000

volumes:
  pgdata:
  pgadmin_data:
  portainer_data:
